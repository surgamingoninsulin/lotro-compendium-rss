name: Build LOTRO plugin feed

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - build_feed.py
      - .github/workflows/build-feed.yml

permissions:
  contents: write             # needed to commit the generated feeds

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          python build_feed.py --out docs \
            --base-url "https://${OWNER}.github.io/${{ github.event.repository.name }}/"

      - name: Commit changes (only if something changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          # lastBuildDate changes every run; only commit when plugin data changed.
          if git diff --cached --quiet -- docs \
             || [ -z "$(git diff --cached -- docs | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE 'lastBuildDate|Last built:')" ]; then
            echo "No plugin changes - nothing to commit."
            git reset -q docs
          else
            git commit -m "Update plugin feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
